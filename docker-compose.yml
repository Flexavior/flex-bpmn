services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "9090:9090"
    environment:
      ENV: production
      CORS_ORIGINS: http://localhost:8088,http://127.0.0.1:8088
      CAMUNDA_DEPLOY_ENABLED: "false"
      LLM_PROVIDER: ollama
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9090/healthz')"]
      interval: 20s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8088:80"
    depends_on:
      api:
        condition: service_healthy
